/api/mocks/mockingusers:
  get:
    tags:
      - Mocks
    summary: Generar usuarios ficticios
    description: Genera usuarios en memoria sin guardarlos en MongoDB.
    parameters:
      - name: quantity
        in: query
        required: false
        description: Cantidad de usuarios; debe estar entre 1 y 100.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
    responses:
      '200':
        description: Usuarios ficticios generados
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  example: success
                quantity:
                  type: integer
                  example: 10
                payload:
                  type: array
                  items:
                    $ref: '#/components/schemas/User'
      '400':
        description: Cantidad inválida
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

/api/mocks/mockingorders:
  get:
    tags:
      - Mocks
    summary: Generar pedidos ficticios
    description: Genera pedidos en memoria sin guardarlos en MongoDB.
    parameters:
      - name: quantity
        in: query
        required: false
        description: Cantidad de pedidos; debe estar entre 1 y 100.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
    responses:
      '200':
        description: Pedidos ficticios generados
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  example: success
                quantity:
                  type: integer
                  example: 10
                payload:
                  type: array
                  items:
                    $ref: '#/components/schemas/Order'
      '400':
        description: Cantidad inválida
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

/api/mocks/generateData:
  post:
    tags:
      - Mocks
    summary: Generar y guardar datos de prueba
    description: >
      Crea usuarios, pedidos y entregas relacionadas y los guarda en
      MongoDB. Primero genera usuarios, después pedidos y finalmente
      entregas.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MockGenerationRequest'
    responses:
      '201':
        description: Datos generados y guardados correctamente
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MockGenerationResponse'
      '400':
        description: >
          Cantidad inválida o cantidad de entregas superior a la cantidad
          de pedidos.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '500':
        description: Error durante la carga en MongoDB
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'