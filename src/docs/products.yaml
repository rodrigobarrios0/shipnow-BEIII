/api/products:
  get:
    tags:
      - Products
    summary: Obtener productos disponibles
    description: Devuelve únicamente productos con estado available.
    responses:
      '200':
        description: Productos obtenidos correctamente
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  example: success
                payload:
                  type: array
                  items:
                    $ref: '#/components/schemas/Product'
      '500':
        description: Error interno
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

  post:
    tags:
      - Products
    summary: Crear un producto
    description: Crea un producto y calcula su estado según el stock.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - name
              - price
              - stock
            properties:
              name:
                type: string
                example: Paquete mediano
              description:
                type: string
                example: Paquete para envío nacional
              price:
                type: number
                minimum: 0
                example: 1500
              stock:
                type: integer
                minimum: 0
                example: 20
    responses:
      '201':
        description: Producto creado correctamente
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  example: success
                payload:
                  $ref: '#/components/schemas/Product'
      '400':
        description: Datos inválidos
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

/api/products/{id}:
  parameters:
    - name: id
      in: path
      required: true
      description: Identificador MongoDB del producto
      schema:
        type: string

  get:
    tags:
      - Products
    summary: Obtener un producto por ID
    responses:
      '200':
        description: Producto encontrado
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  example: success
                payload:
                  $ref: '#/components/schemas/Product'
      '400':
        description: Identificador inválido
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '404':
        description: Producto no encontrado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

  put:
    tags:
      - Products
    summary: Actualizar un producto
    description: Actualiza el producto y recalcula su estado cuando cambia el stock.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                example: Paquete actualizado
              description:
                type: string
                example: Nueva descripción
              price:
                type: number
                minimum: 0
                example: 1800
              stock:
                type: integer
                minimum: 0
                example: 0
    responses:
      '200':
        description: Producto actualizado correctamente
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  example: success
                payload:
                  $ref: '#/components/schemas/Product'
      '400':
        description: Datos o identificador inválidos
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '404':
        description: Producto no encontrado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

  delete:
    tags:
      - Products
    summary: Eliminar un producto
    responses:
      '200':
        description: Producto eliminado correctamente
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  example: success
                payload:
                  $ref: '#/components/schemas/Product'
      '400':
        description: Identificador inválido
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '404':
        description: Producto no encontrado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'